services:
  study-planner:
    build: .
    image: smart-study-planner:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Optional overrides:
      # SERVER_PORT: 8080
    volumes:
      # Persist database and app data across container restarts
      - studyplanner-data:/data

volumes:
  studyplanner-data:
