<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Register</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <th:block th:replace="~{fragments/scripts :: ajax-app}"/>
</head>
<body>
<header>
  <div class="brand"><a th:href="@{/}">Smart Study Planner</a></div>
  <nav><a th:href="@{/login}">Log in</a></nav>
</header>
<main>
  <div class="card" style="max-width:480px">
    <h2>Create account</h2>
    <p th:if="${error}" class="alert" th:text="${error}">Error</p>
    <form th:action="@{/register}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <datalist id="register-usernames">
        <option value="teststudent"/>
        <option value="testtutor"/>
        <option value="testadmin"/>
      </datalist>
      <label>Username
        <input type="text" name="username" required minlength="3" list="register-usernames"
               data-suggest="regUser"
               placeholder="teststudent" value="teststudent"/>
      </label>
      <label>Email
        <input type="email" name="email" required placeholder="you@example.com" value="teststudent@example.com"
               data-suggest="regEmail"/>
      </label>
      <label>Password
        <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" value="testpass123"
               data-suggest="regPass"/>
      </label>
      <label>Role
        <select name="role" required data-suggest-select="true">
          <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">STUDENT</option>
        </select>
      </label>
      <button type="submit">Register</button>
    </form>
  </div>
</main>
</body>
</html>
