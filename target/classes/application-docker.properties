# Profile used when running in Docker (see Dockerfile / docker-compose)
# Persists H2 database under /data (mount a volume for data across restarts)

spring.datasource.url=jdbc:h2:file:/data/studyplanner;DB_CLOSE_DELAY=-1;AUTO_SERVER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

spring.thymeleaf.cache=true
