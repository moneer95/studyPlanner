<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Log in</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <th:block th:replace="~{fragments/scripts :: ajax-app}"/>
</head>
<body>
<header>
  <div class="brand"><a th:href="@{/}">Smart Study Planner</a></div>
  <nav><a th:href="@{/register}">Register</a></nav>
</header>
<main>
  <div class="card" style="max-width:420px">
    <h2>Log in</h2>
    <p th:if="${param.registered}" class="muted">Registration successful. You can sign in now.</p>
    <p th:if="${param.error}" class="alert">Invalid username or password.</p>
    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <datalist id="demo-logins">
        <option value="student"/>
        <option value="tutor"/>
        <option value="admin"/>
      </datalist>
      <label>Username
        <input type="text" name="username" required autocomplete="username" list="demo-logins"
               data-suggest="loginUser"
               placeholder="student" value="student" title="Demo: student / student123"/>
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password"
               data-suggest="loginPass"
               placeholder="student123" value="student123" title="Demo accounts on home page"/>
      </label>
      <button type="submit">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
