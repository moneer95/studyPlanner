<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${quiz.title}">Quiz</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <th:block th:replace="~{fragments/scripts :: ajax-app}"/>
</head>
<body>
<header>
  <div class="brand"><a th:href="@{/student}">← Back</a></div>
</header>
<main>
  <div class="card">
    <h1 th:text="${quiz.title}">Quiz</h1>
    <p class="muted" th:if="${isMock}">Mock exam (syllabus topics stored on this assessment).</p>
    <p class="muted" th:text="${quiz.description}">desc</p>
    <form th:action="@{'/student/quizzes/' + ${quiz.id} + '/submit'}" method="post" data-ajax="true">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="quiz-q" th:each="q, iter : ${quiz.questions}">
        <p><strong th:text="${iter.count + '. ' + q.text}">Q</strong></p>
        <label class="opt"><input type="radio" th:name="${'q' + q.id}" value="0" required checked/> <span th:text="${q.optionA}">A</span></label>
        <label class="opt"><input type="radio" th:name="${'q' + q.id}" value="1"/> <span th:text="${q.optionB}">B</span></label>
        <label class="opt"><input type="radio" th:name="${'q' + q.id}" value="2"/> <span th:text="${q.optionC}">C</span></label>
        <label class="opt"><input type="radio" th:name="${'q' + q.id}" value="3"/> <span th:text="${q.optionD}">D</span></label>
      </div>
      <button type="submit">Submit answers</button>
    </form>
  </div>
</main>
</body>
</html>
